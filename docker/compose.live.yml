services:
  # --- Live-testable service trio (WordPress, Nextcloud, Keycloak) ---
  # Lightweight, API-rich services used to prove real campaign fan-out.
  # Heavier suite members (Mobilizon, OpenProject, Sendy) stay mock by default.

  live-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: katalyst
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - katalyst_livedb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-apache
    environment:
      WORDPRESS_DB_HOST: live-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8081:80"
    depends_on:
      live-db:
        condition: service_healthy

  nextcloud:
    image: nextcloud:30-apache
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: katalyst-admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    ports:
      - "8082:80"
    volumes:
      - katalyst_nextcloud:/var/www/html

  keycloak-live:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8083:8080"

volumes:
  katalyst_livedb:
  katalyst_nextcloud:
